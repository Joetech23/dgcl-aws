# Deploys the site to cPanel (freelearning.dgclgroup.com) on every push to main.
#
# The site is built here, on GitHub's machines, because shared hosting does not
# have the memory to run `next build`. The built files are then uploaded to the
# app folder over FTPS. Only files that changed are sent, and the changed
# tmp/restart.txt tells cPanel (Passenger) to restart the app.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   NEXT_PUBLIC_SUPABASE_URL        Supabase project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY   Supabase anon key
#   FTP_SERVER                      e.g. ftp.dgclgroup.com
#   FTP_USERNAME                    an FTP account whose folder is the app root (~/freelearning)
#   FTP_PASSWORD                    that account's password

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at once: the later push waits, then deploys last.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Build for cPanel
        run: npm run build:cpanel
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/cpanel/
          server-dir: ./
          # The action skips node_modules by default; the site needs its own
          # (site/node_modules), so only git files are excluded here.
          exclude: |
            **/.git*
            **/.git*/**
