# Deploys the site to cPanel (freelearning.dgclgroup.com) on every push to main.
#
# The site is built here, on GitHub's machines, because shared hosting does not
# have the memory to run `next build`. The built files are then uploaded to the
# app folder over FTPS. Only files that changed are sent, and the changed
# tmp/restart.txt tells cPanel (Passenger) to restart the app.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   NEXT_PUBLIC_SUPABASE_URL        Supabase project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY   Supabase anon key
#   FTP_SERVER                      e.g. ftp.dgclgroup.com
#   FTP_USERNAME                    an FTP account whose folder is the app root (~/freelearning)
#   FTP_PASSWORD                    that account's password

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at once: the later push waits, then deploys last.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Values may be saved as repository secrets or, for the non-sensitive ones,
    # as repository variables. The password must be a secret.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      # Fail early, naming whatever is missing (names only, never values).
      - name: Check deployment settings
        run: |
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions > Secrets > Repository secrets."
            exit 1
          fi
          echo "All five settings are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Build for cPanel
        run: npm run build:cpanel

      - name: Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/cpanel/
          server-dir: ./
          # The action skips node_modules by default; the site needs its own
          # (site/node_modules), so only git files are excluded here.
          exclude: |
            **/.git*
            **/.git*/**
